name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      - run: npm install -g npm@latest

      - run: yarn install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$PKG" ] || { echo "tag $GITHUB_REF_NAME does not match package.json ($PKG)"; exit 1; }

      - run: yarn test

      # Authenticates via OIDC against the Trusted Publisher configured on npmjs.com
      # (rakenapp/mobx-mc + publish.yml) — no NPM_TOKEN — and attaches provenance.
      # --tag latest is explicit because higher 3.x/4.x/5.x versions exist; without it
      # npm refuses to implicitly move the `latest` tag onto this 2.x release.
      - run: npm publish --tag latest
