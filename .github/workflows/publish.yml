name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$PKG" ] || { echo "tag $GITHUB_REF_NAME does not match package.json ($PKG)"; exit 1; }

      - run: yarn test

      # --tag latest is explicit because a higher 5.x exists on the registry; without it
      # npm refuses to implicitly move the `latest` tag onto this 2.x release.
      - run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
