name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      - run: npm install -g npm@latest

      - run: yarn install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$PKG" ] || { echo "tag $GITHUB_REF_NAME does not match package.json ($PKG)"; exit 1; }

      - run: yarn test

      # With a Trusted Publisher configured on npmjs.com (see repo setup notes),
      # `npm publish` authenticates via OIDC — no NPM_TOKEN needed — and attaches provenance.
      - run: npm publish
        # Token fallback: delete the `npm install -g` + this comment, drop `id-token`,
        # and use the line below with an NPM_TOKEN repo secret instead of Trusted Publishing:
        #   env:
        #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
